# Generated by `emdash-plugin release setup --trigger changesets`
# (@emdash-cms/plugin-cli 0.13.3), then adapted for this repository:
# npm instead of pnpm, Node from .nvmrc, the release Action pinned to a
# commit, and a prerelease guard. Re-apply these adaptations after any
# regeneration. See RELEASING.md.
name: "Publish EmDash plugins"

on:
  workflow_call:
    inputs:
      published-packages:
        description: "Changesets Action published-packages JSON output"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      package:
        description: "Plugin ID to publish"
        required: true
        type: string

permissions: {}

concurrency:
  group: emdash-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: "Plan plugin releases"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      selectors: ${{ steps.changesets.outputs.selectors || steps.manual.outputs.selectors }}
    steps:
      - name: "Check out repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: "Plan Changesets plugin releases"
        id: changesets
        if: ${{ github.event_name == 'workflow_call' }}
        shell: bash
        env:
          EMDASH_PUBLISHED_PACKAGES: ${{ inputs.published-packages }}
        run: |
          set -euo pipefail
          npx --yes @emdash-cms/plugin-cli@0.13.3 release plan --published-packages "${EMDASH_PUBLISHED_PACKAGES}" --dir .

      - name: "Plan manual plugin release"
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EMDASH_RELEASE_SELECTOR: ${{ inputs.package }}
        run: |
          set -euo pipefail
          npx --yes @emdash-cms/plugin-cli@0.13.3 release plan --package "${EMDASH_RELEASE_SELECTOR}" --dir .

  publish:
    name: "Build and publish ${{ matrix.selector }}"
    needs: plan
    if: ${{ needs.plan.outputs.selectors != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        selector: ${{ fromJSON(needs.plan.outputs.selectors) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for the audience-bound GitHub OIDC token.
      attestations: write # Required to sign build provenance.
    steps:
      - name: "Check repository visibility"
        if: ${{ github.event.repository.visibility != 'public' }}
        run: |
          echo "::error title=Public repository required::EmDash releases currently require a public GitHub repository because private and internal repository attestations cannot yet be verified."
          exit 1

      - name: "Check out repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: "Set up Node.js"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: "Install dependencies"
        run: npm ci

      # Fail closed: a prerelease published under the real plugin slug
      # would become the latest version for every install. Betas publish
      # under a separate beta plugin name once that wiring lands; see
      # "Beta status" in RELEASING.md.
      - name: "Refuse prerelease versions"
        shell: bash
        env:
          EMDASH_RELEASE_SELECTOR: "${{ matrix.selector }}"
        run: |
          set -euo pipefail
          version="${EMDASH_RELEASE_SELECTOR##*@}"
          if [[ "$version" == *-* ]]; then
            echo "::error title=Prerelease refused::${EMDASH_RELEASE_SELECTOR} is a prerelease. Registry publishing for betas needs the separate beta plugin name; see RELEASING.md."
            exit 1
          fi

      - name: "Prepare plugin release"
        id: prepare
        shell: bash
        env:
          EMDASH_RELEASE_SELECTOR: "${{ matrix.selector }}"
        run: |
          set -euo pipefail
          ./node_modules/.bin/emdash-plugin release prepare "${EMDASH_RELEASE_SELECTOR}" --dir . --out-dir .emdash-release

      - name: "Create build provenance"
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.prepare.outputs.bundle-file }}

      - name: "Publish plugin"
        uses: emdash-cms/emdash/apps/release-action@06f911b54f387a1284c767187042d7e11f6044fc # emdash main at generation time; bump deliberately
        with:
          service-url: https://releases.emdashcms.com
          publisher-did: ${{ steps.prepare.outputs.publisher-did }}
          bundle-file: ${{ steps.prepare.outputs.bundle-file }}
          provenance-file: ${{ steps.attest.outputs.bundle-path }}
