name: Repository contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run, which no one waits on any more.
# Pushes to main each get their own group and are never cancelled.
concurrency:
  group: repo-contract-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests that only touch records and docs (.github/scripts/browser-plan.mjs)
  # skip the browser steps; their jobs still report success. Pushes to main and
  # manual runs always run everything.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | node .github/scripts/browser-plan.mjs >> "$GITHUB_OUTPUT"
          else
            echo "browser=true" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # bin/verify-commerce core runs as three parallel jobs (checks, storefront,
  # packaged); public-contract below passes only when all three pass.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bin/verify-commerce checks

  storefront:
    needs: plan
    runs-on: ubuntu-latest
    # The browser's Ubuntu packages alone can take over 9 minutes on a slow mirror.
    timeout-minutes: 20
    steps:
      - if: needs.plan.outputs.browser != 'true'
        run: echo "Only records and docs changed; the browser tests are skipped."
      - if: needs.plan.outputs.browser == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - if: needs.plan.outputs.browser == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.plan.outputs.browser == 'true'
        run: npm ci
      - if: needs.plan.outputs.browser == 'true'
        uses: ./.github/actions/setup-chromium
      - if: needs.plan.outputs.browser == 'true'
        run: bin/verify-commerce storefront

  packaged:
    needs: plan
    runs-on: ubuntu-latest
    # The browser's Ubuntu packages alone can take over 9 minutes on a slow mirror.
    timeout-minutes: 20
    steps:
      - if: needs.plan.outputs.browser != 'true'
        run: echo "Only records and docs changed; the browser tests are skipped."
      - if: needs.plan.outputs.browser == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - if: needs.plan.outputs.browser == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.plan.outputs.browser == 'true'
        run: npm ci
      - if: needs.plan.outputs.browser == 'true'
        uses: ./.github/actions/setup-chromium
      - if: needs.plan.outputs.browser == 'true'
        run: bin/verify-commerce packaged
      - name: Preserve allowlisted installed-consumer evidence
        if: always() && needs.plan.outputs.browser == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commerce-consumers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/commerce-consumers-runs/*/evidence/registry-settings.png
            .tmp/commerce-consumers-runs/*/evidence/registry-failure.png
            .tmp/commerce-consumers-runs/*/evidence/native-settings.png
            .tmp/commerce-consumers-runs/*/evidence/native-failure.png
            .tmp/commerce-consumers-runs/*/evidence/outcomes.json
            .tmp/commerce-consumers-runs/*/evidence/digests.json
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn

  # Keeps the single public-contract check that reviewers and ClawSweeper wait on.
  # It runs even when a part fails, so a failed part shows as a failed check
  # instead of a skipped (passing) one.
  public-contract:
    needs: [plan, checks, storefront, packaged]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require checks, storefront and packaged
        env:
          CHECKS: ${{ needs.checks.result }}
          STOREFRONT: ${{ needs.storefront.result }}
          PACKAGED: ${{ needs.packaged.result }}
        run: |
          echo "checks=${CHECKS} storefront=${STOREFRONT} packaged=${PACKAGED}"
          test "$CHECKS" = success
          test "$STOREFRONT" = success
          test "$PACKAGED" = success

  merchant-settings:
    needs: plan
    runs-on: ubuntu-latest
    # The browser's Ubuntu packages alone can take over 9 minutes on a slow mirror.
    timeout-minutes: 20
    steps:
      - if: needs.plan.outputs.browser != 'true'
        run: echo "Only records and docs changed; the browser tests are skipped."
      - if: needs.plan.outputs.browser == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - if: needs.plan.outputs.browser == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: needs.plan.outputs.browser == 'true'
        run: npm ci
      - if: needs.plan.outputs.browser == 'true'
        uses: ./.github/actions/setup-chromium
      - name: Native and Registry merchant settings
        if: needs.plan.outputs.browser == 'true'
        run: npm run test:settings
      - name: Preserve allowlisted synthetic settings evidence
        if: always() && needs.plan.outputs.browser == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commerce-settings-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/settings-evidence/*/*.png
            .tmp/settings-evidence/*/outcomes.json
            .tmp/settings-evidence/*/digests.json
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
