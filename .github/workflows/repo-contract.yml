name: Repository contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    # The browser's Ubuntu packages alone can take over 9 minutes on a slow mirror.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runner image already has Chromium's system libraries; --with-deps only
      # added fonts and package upgrades from a mirror that is sometimes very slow.
      - run: npx playwright install chromium
      - run: bin/verify-commerce core
      - name: Preserve allowlisted installed-consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commerce-consumers-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/commerce-consumers-runs/*/evidence/registry-settings.png
            .tmp/commerce-consumers-runs/*/evidence/registry-failure.png
            .tmp/commerce-consumers-runs/*/evidence/native-settings.png
            .tmp/commerce-consumers-runs/*/evidence/native-failure.png
            .tmp/commerce-consumers-runs/*/evidence/outcomes.json
            .tmp/commerce-consumers-runs/*/evidence/digests.json
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn

  merchant-settings:
    runs-on: ubuntu-latest
    # The browser's Ubuntu packages alone can take over 9 minutes on a slow mirror.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runner image already has Chromium's system libraries; --with-deps only
      # added fonts and package upgrades from a mirror that is sometimes very slow.
      - run: npx playwright install chromium
      - name: Native and Registry merchant settings
        run: npm run test:settings
      - name: Preserve allowlisted synthetic settings evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commerce-settings-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .tmp/settings-evidence/*/*.png
            .tmp/settings-evidence/*/outcomes.json
            .tmp/settings-evidence/*/digests.json
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
