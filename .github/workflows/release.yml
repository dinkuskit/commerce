# Release flow for GrillTrack release-beta-cut-071 (dinkuskit/dinkuskit), the same release files as
# dinkuskit/payments with Commerce's names. Run workflow has two buttons in one: Cut beta publishes
# the next dinkus-commerce-beta from main and starts the beta-store journeys, and Promote turns a
# beta that passed them into the one "ci: release" PR. Merging that PR is the stable publish yes:
# the push tags it, creates the GitHub Release, and hands the Registry publish to
# emdash-release.yml. See RELEASING.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Cut beta: publish the next beta from main. Promote: open the ci: release PR for a verified beta."
        required: true
        default: cut-beta
        type: choice
        options:
          - cut-beta
          - promote
      beta_version:
        description: "Cut beta: leave blank for the next X.Y.Z-beta.N, or give one. Promote: the verified beta (e.g. 0.4.0-beta.1)."
        required: false
        default: ""
        type: string
      proof_ref:
        description: "Promote only: the passing Live journeys run's address followed by (X.Y.Z-beta.N @running pass)"
        required: false
        default: ""
        type: string

concurrency:
  group: release-${{ github.ref }}
  # A cancelled publish can leave only part of a release behind.
  cancel-in-progress: false

# Default-deny at the workflow level. Each job scopes its own permissions, and every write
# (tags, the release PR, the GitHub Release) uses the release GitHub App's token.
permissions: {}

jobs:
  release:
    name: Promote verified beta PR or tag merged stable release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.action == 'promote')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      published: ${{ steps.state.outputs.published }}
      registry_needed: ${{ steps.state.outputs.registry_needed }}
      version: ${{ steps.state.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Commerce's unit tests load better-sqlite3, so dependencies install with their scripts; the
      # release token is minted only after install, tests and typecheck.
      - name: Install dependencies
        run: npm ci

      - name: Check package version stays on 0.x
        run: node .github/scripts/check-no-major.mjs

      - name: Run unit tests (builds the Commerce prebundle first)
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Mint release GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Configure git identity and push authentication for release bot
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')"

      - name: Promote verified beta to release PR (manual workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          BETA_VERSION: ${{ inputs.beta_version }}
          PROOF_REF: ${{ inputs.proof_ref }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$BETA_VERSION" ] || [ -z "$PROOF_REF" ]; then
            echo "::error title=Promote needs a beta and its proof::Fill in beta_version (the verified X.Y.Z-beta.N) and proof_ref (the passing Live journeys run's address followed by (X.Y.Z-beta.N @running pass))."
            exit 1
          fi
          node scripts/release-flow.mjs promote \
            --beta-version "$BETA_VERSION" \
            --proof-ref "$PROOF_REF"

      - name: "Tag and create GitHub Release on merged ci: release PR"
        id: state
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "published=false"
              echo "registry_needed=false"
              echo "version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/release-flow.mjs publish-merged-release --github-output "$GITHUB_OUTPUT"

  publish-emdash:
    name: Publish stable release to EmDash Registry
    needs: release
    if: needs.release.outputs.published == 'true' || needs.release.outputs.registry_needed == 'true'
    uses: ./.github/workflows/emdash-release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      version: ${{ needs.release.outputs.version }}
      release_mode: stable

  cut-beta:
    name: Cut beta
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action == 'cut-beta'
    uses: ./.github/workflows/emdash-release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.beta_version }}
      release_mode: beta
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  # A beta that Cut beta just published is tested at once: this presses SaariusSkills' "Live
  # journeys" button, which updates the beta store, beta.sm0ky.dev, to that beta once the Registry
  # offers it and runs the @running journeys there. The run's name carries the beta, its page shows
  # pass or fail and the plugin versions tested, and its address is the proof_ref for Promote
  # (RELEASING.md). Stable releases never press it.
  live-journeys:
    name: Start the live journeys on the beta store
    needs: cut-beta
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Press Live journeys in SaariusSkills
        env:
          # A fine-grained token that can only start workflow runs in saariuslystoned/SaariusSkills.
          GH_TOKEN: ${{ secrets.LIVE_JOURNEYS_TOKEN }}
          BETA: ${{ needs.cut-beta.outputs.slug }} ${{ needs.cut-beta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Live journeys not started::The LIVE_JOURNEYS_TOKEN secret is not set. The beta is published; press Run workflow on SaariusSkills' Live journeys with beta \"$BETA\"."
            exit 1
          fi
          gh workflow run live-journeys.yml --repo saariuslystoned/SaariusSkills --ref main -f journeys=@running -f beta="$BETA"
          {
            echo "## Live journeys started for $BETA"
            echo
            echo "Its run is named \"Live journeys for $BETA\": https://github.com/saariuslystoned/SaariusSkills/actions/workflows/live-journeys.yml"
            echo
            echo "When it passes, promote with \`proof_ref\` set to that run's address followed by \`(${BETA##* } @running pass)\`."
          } >> "$GITHUB_STEP_SUMMARY"
